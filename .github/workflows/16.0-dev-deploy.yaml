name: DEV_16_DEPLOY

on:
  push:
    branches:
      - 16.0-development

env:
  odoo_version: "16.0"
  image_name: ghcr.io/daysumops/16.0-development

jobs:
  # Each architecture is built NATIVELY on a runner of that architecture.
  # No QEMU: emulating the arm64 build segfaults wkhtmltox's postinst
  # ("qemu: uncaught target signal 11"), so cross-building cannot work.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: free disk space
        run: |
          df -h
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          df -h

      - name: checkout content
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile-16
          platforms: linux/${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=odoo16-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=odoo16-${{ matrix.arch }}
          outputs: >-
            type=image,name=${{ env.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitches the two single-arch manifests into one multi-arch tag, so
  # every server pulls the same reference regardless of its architecture.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA:0:6}"
          refs=()
          for digest in *; do
            refs+=("${IMAGE_NAME}@sha256:${digest}")
          done
          echo "merging: ${refs[*]}"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${sha_short}" \
            --tag "${IMAGE_NAME}:latest" \
            "${refs[@]}"
        env:
          IMAGE_NAME: ${{ env.image_name }}

      - name: Inspect result
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"
        env:
          IMAGE_NAME: ${{ env.image_name }}
