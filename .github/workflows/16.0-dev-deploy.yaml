name: DEV_16_DEPLOY

on:
  push:
    branches:
      - 16.0-development

env:
  odoo_version: "16.0"
  image_name: ghcr.io/daysumops/16.0-development

jobs:
  build:
    runs-on: ubuntu-24.04
    # Two platforms, one of them emulated: a first cold build is slow.
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
      deployments: write
      id-token: write
      packages: write

    steps:
      - name: free disk space
        run: |
          df -h
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          df -h

      - name: checkout content
        uses: actions/checkout@v4

      # Needed so the native amd64 runner can build the arm64 half of the image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Required for multi-platform: the default docker driver cannot do it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: benjlevesque/short-sha@v2.2
        id: short-sha
        with:
          length: 6

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile-16
          push: true
          # Servers are mixed: amd64 and arm64 both pull the same tag.
          platforms: linux/amd64,linux/arm64
          # Plain manifest list, no attestation manifests, so older docker
          # clients on the estate resolve the tag without special handling.
          provenance: false
          cache-from: type=gha,scope=odoo16
          cache-to: type=gha,mode=max,scope=odoo16
          tags: |
            ${{ env.image_name }}:${{ steps.short-sha.outputs.sha }}
            ${{ env.image_name }}:latest
